/* ---------- State ---------- */
const STORE_KEY = "spzero-progress-v1";
let state = { done: {}, code: {}, mod: 0, ex: 0 };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && typeof saved === "object") state = Object.assign(state, saved);
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const ALL_EX = MODULES.flatMap(m => m.exercises.map(x => x.id));
const TOTAL = ALL_EX.length;

/* ---------- Python engine (Pyodide: real Python + NumPy in the browser) ---------- */
let engine = "loading";
let py = null;
const BRIDGE = `
import os
os.environ["MPLBACKEND"] = "Agg"
import io, json, contextlib, base64
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt
plt.rcParams["figure.figsize"] = (6, 3.8)
plt.show = lambda *a, **k: None

def _images():
    out = []
    for n in plt.get_fignums():
        b = io.BytesIO()
        plt.figure(n).savefig(b, format="png", dpi=90, bbox_inches="tight")
        out.append("data:image/png;base64," + base64.b64encode(b.getvalue()).decode())
    return out

def _run(code, check):
    plt.close("all")
    buf = io.StringIO()
    ns = {"__name__": "__main__"}
    err = ""
    try:
        compiled = compile(code, "<your code>", "exec")
        with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
            exec(compiled, ns)
    except SyntaxError as e:
        err = type(e).__name__ + (" on line " + str(e.lineno) if e.lineno else "") + ": " + str(e.msg)
    except Exception as e:
        line = None
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "<your code>":
                line = tb.tb_lineno
            tb = tb.tb_next
        err = type(e).__name__ + (" on line " + str(line) if line else "") + ": " + str(e)
    text = buf.getvalue()
    ok = False
    msg = ""
    if not err and check:
        ns["__output__"] = text
        ns["__code__"] = code
        try:
            with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                exec(check, ns)
            ok = True
        except AssertionError as e:
            msg = str(e)
        except Exception as e:
            msg = "While testing your chart: " + type(e).__name__ + ": " + str(e)
    imgs = []
    try:
        imgs = _images()
    except Exception as e:
        if not err:
            err = "Couldn’t draw the chart: " + type(e).__name__ + ": " + str(e)
    plt.close("all")
    return json.dumps({"ok": ok, "out": text, "err": err, "msg": msg, "imgs": imgs})
`;
function setEngine(kind, detail) {
  engine = kind;
  const dot = document.getElementById("engine-dot");
  const txt = document.getElementById("engine-text");
  dot.className = "dot" + (kind === "ready" ? " ok" : kind === "none" ? " bad" : "");
  txt.textContent = kind === "ready" ? "Python and SciPy are ready"
    : kind === "none" ? "Python couldn’t start" + (detail ? " (" + detail + ")" : "") + ". Check your internet connection and reload."
    : kind === "numpy" ? "Loading SciPy and Matplotlib… (this is the slow part)"
    : "Starting Python… (the first time can take up to a minute)";
}
async function initPy() {
  setTimeout(() => { if (engine !== "ready" && engine !== "none") setEngine("none", "took longer than 90 seconds"); }, 90000);
  try {
    if (typeof loadPyodide !== "function") throw new Error("Pyodide script not loaded");
    py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/" });
    setEngine("numpy");
    await py.loadPackage(["numpy", "matplotlib", "scipy"]);
    py.runPython(BRIDGE);
    if (engine !== "none") setEngine("ready"); else setEngine("ready");
  } catch (e) {
    console.error(e);
    setEngine("none", String((e && e.message) || e).slice(0, 140));
  }
}
async function runPython(code, check) {
  if (engine !== "ready") return { ok: false, out: "", err: "", msg: "Python is still starting. Wait a few seconds and try again." };
  await new Promise(r => setTimeout(r, 30));
  try { await py.loadPackagesFromImports(code); } catch (e) {}
  try {
    const fn = py.globals.get("_run");
    const raw = fn(code, check ? PRELUDE + "\n" + check : "");
    fn.destroy();
    return JSON.parse(raw);
  } catch (e) {
    return { ok: false, out: "", err: "Something went wrong running your code: " + e.message, msg: "" };
  }
}

const FRIENDLY = {
  NameError: "Python doesn’t know this name. Check the spelling, or create the variable before using it.",
  TypeError: "You mixed types that don’t go together, like text + number. Convert with int(), float() or str().",
  IndexError: "That list position doesn’t exist. Positions start at 0, and the last one is -1.",
  ValueError: "The type is right but the value isn’t, like int(\"abc\").",
  ZeroDivisionError: "You divided by zero, which isn’t possible.",
  SyntaxError: "Python can’t read this line. Look for a missing colon, bracket, or quote.",
  IndentationError: "The spaces at the start of a line are wrong. Lines inside if, for, while and def need 4 spaces.",
  KeyError: "That key isn’t in the dictionary. Check the spelling and capital letters.",
  AttributeError: "This value doesn’t have that tool. Check the spelling after the dot.",
  ModuleNotFoundError: "That library isn’t available here. This course has SciPy, NumPy, Matplotlib and pandas."
};
function friendlyFor(err) {
  if (/could not be broadcast/.test(err)) return "Your arrays have different sizes, so NumPy can’t pair them up. Check each one’s .shape.";
  if (/truth value of an array/.test(err)) return "Use & and | (with brackets around each rule) instead of and / or when working with arrays.";
  if (/cannot reshape/.test(err)) return "The new shape needs the same total number of items. Rows × columns must equal the array’s size.";
  if (/f\(a\) and f\(b\) must have different signs/.test(err)) return "brentq needs the function to be positive at one end and negative at the other. Try a wider range.";
  if (/Optimal parameters not found/.test(err)) return "curve_fit couldn’t find a good fit. Give it starting guesses with p0=[...], close to the values you expect.";
  if (/window_length must be/.test(err) || /polyorder must be less/.test(err)) return "Check the filter settings: the window must be an odd number, bigger than the polynomial order, and not longer than your data.";
  if (/must have same first dimension/.test(err)) return "Your x and y lists have different lengths. They must have the same number of values.";
  if (/name 'plt' is not defined/.test(err)) return "Add import matplotlib.pyplot as plt at the top of your code.";
  if (/name 'pd' is not defined/.test(err)) return "Add import pandas as pd at the top of your code.";
  if (/name 'io' is not defined/.test(err)) return "Add import io at the top of your code.";
  if (/^KeyError/.test(err)) return "pandas can’t find that column or row name. Check the spelling and capital letters, and print(df.columns) to see the real names.";
  if (/name 'np' is not defined/.test(err)) return "Add import numpy as np at the top of your code.";
  if (/too many indices/.test(err)) return "You used more positions than the array has dimensions. A 1D array only needs one number in the brackets.";
  const name = (err.match(/^(\w+)/) || [])[1];
  return FRIENDLY[name] || "Read the error name above. It tells you what kind of problem it is.";
}

/* ---------- Progress ---------- */
function doneCount() { return ALL_EX.filter(id => state.done[id]).length; }
function renderProgress() {
  const k = doneCount();
  const pct = Math.round(k / TOTAL * 100);
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("bar-fill").style.width = pct + "%";
  document.getElementById("pct-note").textContent = k === TOTAL ? `All ${TOTAL} exercises solved` : `${k} of ${TOTAL} exercises solved`;
}

/* ---------- Sidebar ---------- */
function renderSidebar() {
  const ul = document.getElementById("modlist");
  ul.innerHTML = "";
  MODULES.forEach((m, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "mod-btn";
    b.setAttribute("aria-current", i === state.mod ? "true" : "false");
    const n = document.createElement("span"); n.className = "mod-n"; n.textContent = String(i + 1);
    const t = document.createElement("span"); t.textContent = m.title;
    const c = document.createElement("span"); c.className = "mod-count";
    const k = m.exercises.filter(x => state.done[x.id]).length;
    c.textContent = `${k}/${m.exercises.length}`;
    if (k === m.exercises.length) c.classList.add("full");
    b.append(n, t, c);
    b.addEventListener("click", () => { state.mod = i; state.ex = 0; save(); render(); window.scrollTo(0, 0); });
    li.appendChild(b); ul.appendChild(li);
  });
}

/* ---------- Editor ---------- */
function makeEditor(value, onChange, onSubmit) {
  const ta = document.createElement("textarea");
  ta.className = "code"; ta.spellcheck = false; ta.autocapitalize = "off"; ta.autocomplete = "off";
  ta.setAttribute("autocorrect", "off");
  ta.setAttribute("aria-label", "Code editor");
  ta.value = value;
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(140, ta.scrollHeight + 4) + "px"; };
  ta.addEventListener("input", () => { onChange && onChange(ta.value); fit(); });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onSubmit && onSubmit(); return; }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      onChange && onChange(ta.value); fit();
    } else if (e.key === "Enter") {
      const s = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
      const line = ta.value.slice(lineStart, s);
      let indent = (line.match(/^ */) || [""])[0];
      if (/:\s*$/.test(line)) indent += "    ";
      if (indent) {
        e.preventDefault();
        ta.value = ta.value.slice(0, s) + "\n" + indent + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 1 + indent.length;
        onChange && onChange(ta.value); fit();
      }
    }
  });
  requestAnimationFrame(fit);
  return ta;
}

function makeConsole() {
  const con = document.createElement("div");
  con.className = "console";
  con.innerHTML = `<div class="console-head">Output</div><pre aria-live="polite">Press Run to see the result.</pre><div class="plots"></div><div class="verdict" hidden></div>`;
  return con;
}

function showResult(con, res, isCheck) {
  con.className = "console";
  const head = con.querySelector(".console-head");
  const pre = con.querySelector("pre");
  const verdict = con.querySelector(".verdict");
  pre.textContent = "";
  if (res.out) pre.append(document.createTextNode(res.out));
  if (res.err) {
    const s = document.createElement("span"); s.className = "err-line";
    s.textContent = (res.out && !res.out.endsWith("\n") ? "\n" : "") + res.err;
    pre.append(s);
  }
  const plots = con.querySelector(".plots");
  plots.innerHTML = "";
  (res.imgs || []).forEach(src => { const im = document.createElement("img"); im.src = src; im.alt = "Your chart"; plots.appendChild(im); });
  pre.hidden = !res.out && !res.err && (res.imgs || []).length > 0;
  if (!res.out && !res.err && !isCheck && !res.msg && !(res.imgs || []).length) pre.textContent = "(your code ran, but nothing was printed or plotted)";
  verdict.hidden = true; verdict.className = "verdict";
  if (res.err) {
    head.textContent = "Error";
    con.classList.add("fail");
    verdict.hidden = false; verdict.classList.add("fail");
    verdict.textContent = friendlyFor(res.err);
  } else if (isCheck) {
    head.textContent = res.ok ? "Correct" : "Not yet";
    con.classList.add(res.ok ? "pass" : "fail");
    verdict.hidden = false; verdict.classList.add(res.ok ? "pass" : "fail");
    verdict.textContent = res.ok ? "Well done. Exercise solved." : (res.msg || "Not quite. Compare your output with the task.");
  } else {
    head.textContent = "Output";
    if (res.msg) { verdict.hidden = false; verdict.textContent = res.msg; }
  }
}

/* ---------- Main render ---------- */
function render() {
  renderSidebar(); renderProgress();
  const m = MODULES[state.mod];
  const main = document.getElementById("main");
  main.innerHTML = "";

  const head = document.createElement("div"); head.className = "lesson-head";
  const h1 = document.createElement("h1"); h1.textContent = `${state.mod + 1}. ${m.title}`;
  const p = document.createElement("p"); p.textContent = m.blurb;
  head.append(h1, p); main.appendChild(head);

  // Learn section
  const det = document.createElement("details"); det.className = "learn";
  det.open = !m.exercises.some(x => state.done[x.id]);
  const sum = document.createElement("summary"); sum.textContent = "Learn this first";
  const body = document.createElement("div"); body.className = "learn-body";
  m.learn.forEach((b, i) => {
    const blk = document.createElement("div"); blk.className = "block";
    const step = document.createElement("div"); step.className = "block-step"; step.textContent = `Step ${i + 1} of ${m.learn.length}`;
    const txt = document.createElement("div"); txt.innerHTML = b.t;
    blk.append(step, txt);
    if (b.code) {
      const s = document.createElement("div"); s.className = "sample" + (b.img ? " stack" : b.out ? "" : " solo");
      const c = document.createElement("pre"); c.className = "s-code";
      c.innerHTML = "<span class='s-tag'></span>"; c.firstChild.textContent = b.label || "Code"; c.append(document.createTextNode(b.code));
      s.appendChild(c);
      if (b.img) {
        const o = document.createElement("div"); o.className = "s-img";
        o.innerHTML = "<span class='s-tag'>What it shows</span>";
        if (b.out) { const tp = document.createElement("pre"); tp.className = "s-imgtext"; tp.textContent = b.out; o.appendChild(tp); }
        const im = document.createElement("img"); im.src = b.img; im.alt = "Chart made by this code"; im.loading = "lazy";
        o.appendChild(im); s.appendChild(o);
      } else if (b.out) {
        const o = document.createElement("pre"); o.className = "s-out";
        o.innerHTML = "<span class='s-tag'>What it shows</span>"; o.append(document.createTextNode(b.out));
        s.appendChild(o);
      }
      blk.appendChild(s);
    }
    body.appendChild(blk);
  });
  // Playground
  const tryHead = document.createElement("p"); tryHead.className = "try-head"; tryHead.textContent = "Try it yourself: run this, change something, run it again.";
  let pgCode = m.playground;
  const pgWrap = document.createElement("div"); pgWrap.className = "editor-wrap";
  const pgBar = document.createElement("div"); pgBar.className = "editor-bar"; pgBar.innerHTML = "<span>Playground</span><span>Nothing here is graded</span>";
  const pgCon = makeConsole();
  const runPg = async () => { const p = pgCon.querySelector("pre"); p.hidden = false; p.textContent = "Running…"; showResult(pgCon, await runPython(pgCode, ""), false); };
  const pgTa = makeEditor(pgCode, v => pgCode = v, runPg);
  pgWrap.append(pgBar, pgTa);
  const pgActions = document.createElement("div"); pgActions.className = "actions";
  const pgRun = document.createElement("button"); pgRun.className = "btn"; pgRun.textContent = "Run";
  pgRun.addEventListener("click", runPg);
  pgActions.appendChild(pgRun);
  body.append(tryHead, pgWrap, pgActions, pgCon);
  det.append(sum, body); main.appendChild(det);

  // Exercise
  if (state.ex >= m.exercises.length) state.ex = 0;
  const ex = m.exercises[state.ex];

  const nav = document.createElement("div"); nav.className = "ex-nav";
  const steps = document.createElement("div"); steps.className = "steps";
  m.exercises.forEach((x, i) => {
    const b = document.createElement("button"); b.className = "step" + (state.done[x.id] ? " done" : "");
    b.textContent = state.done[x.id] ? "✓" : String(i + 1);
    b.setAttribute("aria-label", `Exercise ${i + 1}${state.done[x.id] ? ", solved" : ""}`);
    b.setAttribute("aria-current", i === state.ex ? "true" : "false");
    b.addEventListener("click", () => { state.ex = i; save(); render(); });
    steps.appendChild(b);
  });
  const t = document.createElement("h2"); t.className = "ex-title"; t.textContent = `Exercise: ${ex.title}`;
  nav.append(steps, t); main.appendChild(nav);

  const task = document.createElement("div"); task.className = "task"; task.innerHTML = ex.task;
  main.appendChild(task);

  let code = state.code[ex.id] != null ? state.code[ex.id] : ex.starter;
  const wrap = document.createElement("div"); wrap.className = "editor-wrap";
  const bar = document.createElement("div"); bar.className = "editor-bar";
  bar.innerHTML = "<span>Your code</span><span>Ctrl/⌘ + Enter to check</span>";
  const con = makeConsole();
  const helper = document.createElement("div"); helper.className = "helper"; helper.hidden = true;

  const actions = document.createElement("div"); actions.className = "actions";
  const runBtn = document.createElement("button"); runBtn.className = "btn"; runBtn.textContent = "Run";
  const checkBtn = document.createElement("button"); checkBtn.className = "btn primary"; checkBtn.textContent = "Check answer";
  const hintBtn = document.createElement("button"); hintBtn.className = "btn"; hintBtn.textContent = "Hint";
  const solBtn = document.createElement("button"); solBtn.className = "btn"; solBtn.textContent = "Solution";
  const resetBtn = document.createElement("button"); resetBtn.className = "btn ghost"; resetBtn.textContent = "Reset code";

  const nextRow = document.createElement("div"); nextRow.className = "next-row";
  const prevBtn = document.createElement("button"); prevBtn.className = "btn"; prevBtn.textContent = "Previous";
  const nextBtn = document.createElement("button");
  const isLastEx = state.ex === m.exercises.length - 1;
  const isLastMod = state.mod === MODULES.length - 1;
  nextBtn.className = "btn" + (state.done[ex.id] ? " primary" : "");
  nextBtn.textContent = isLastEx ? (isLastMod ? "Back to start" : "Next lesson") : "Next exercise";
  prevBtn.disabled = state.mod === 0 && state.ex === 0;

  const doRun = async () => {
    con.querySelector("pre").hidden = false; con.querySelector("pre").textContent = "Running…";
    showResult(con, await runPython(code, ""), false);
  };
  const doCheck = async () => {
    checkBtn.disabled = true;
    con.querySelector("pre").hidden = false; con.querySelector("pre").textContent = "Checking…";
    const res = await runPython(code, ex.check);
    checkBtn.disabled = false;
    showResult(con, res, true);
    if (res.ok) {
      nextBtn.classList.add("primary");
      if (!state.done[ex.id]) {
        state.done[ex.id] = true; save(); renderSidebar(); renderProgress();
        const b = steps.children[state.ex]; b.classList.add("done"); b.textContent = "✓";
        if (doneCount() === TOTAL) showFinish();
      }
    }
  };
  const ta = makeEditor(code, v => { code = v; state.code[ex.id] = v; save(); }, doCheck);
  wrap.append(bar, ta); main.appendChild(wrap);

  runBtn.addEventListener("click", doRun);
  checkBtn.addEventListener("click", doCheck);
  hintBtn.addEventListener("click", () => {
    helper.hidden = false; helper.innerHTML = "<h3>Hint</h3>";
    const p = document.createElement("p"); p.textContent = ex.hint; helper.appendChild(p);
  });
  solBtn.addEventListener("click", () => {
    helper.hidden = false;
    helper.innerHTML = "<h3>Solution</h3><p>Read it, understand each line, then type it yourself instead of copying. That’s how it sticks.</p>";
    const pre = document.createElement("pre"); pre.textContent = ex.solution; helper.appendChild(pre);
  });
  resetBtn.addEventListener("click", () => {
    code = ex.starter; ta.value = code; delete state.code[ex.id]; save(); ta.dispatchEvent(new Event("input"));
  });
  actions.append(runBtn, checkBtn, hintBtn, solBtn, resetBtn);
  main.append(actions, con, helper);

  prevBtn.addEventListener("click", () => {
    if (state.ex > 0) state.ex--; else { state.mod--; state.ex = MODULES[state.mod].exercises.length - 1; }
    save(); render(); window.scrollTo(0, 0);
  });
  nextBtn.addEventListener("click", () => {
    if (!isLastEx) state.ex++;
    else if (isLastMod) { state.mod = 0; state.ex = 0; }
    else { state.mod++; state.ex = 0; }
    save(); render(); window.scrollTo(0, 0);
  });
  nextRow.append(prevBtn, nextBtn);
  main.appendChild(nextRow);

  function showFinish() {
    const f = document.createElement("div"); f.className = "finish";
    f.innerHTML = "<h2>You finished every exercise</h2><p>You can now use probability, compare groups, fit lines and curves with uncertainties, clean signals and find peaks, integrate, solve equations and run a real Tafel analysis. That’s the core toolkit of scientific data analysis in Python.</p>";
    main.appendChild(f);
  }
  if (doneCount() === TOTAL) showFinish();
}

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Erase all progress and saved code?")) return;
  state = { done: {}, code: {}, mod: 0, ex: 0 }; save(); render();
});

if (state.mod >= MODULES.length) state.mod = 0;
render();
setEngine("loading");
initPy();
</script>

</body>
