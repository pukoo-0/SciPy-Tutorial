<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SciPy from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EAF0F3;
  --surface: #FFFFFF;
  --ink: #18263A;
  --muted: #5B6B7E;
  --line: #C9D5DE;
  --accent: #2F7D5B;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE5;
  --error: #B4412E;
  --error-soft: #F7E1DC;
  --code-bg: #F4F7F9;
  --out-bg: #18263A;
  --out-ink: #E3EAF0;
  --grid: rgba(24, 38, 58, 0.05);
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1720; --surface: #16212C; --ink: #E3EAF0; --muted: #93A3B3; --line: #2A3947;
    --accent: #5FC497; --accent-ink: #0B1B13; --accent-soft: #183A2C; --error: #F08A74; --error-soft: #3A1F1A;
    --code-bg: #0E1821; --out-bg: #070D13; --out-ink: #CFE0D7; --grid: rgba(227, 234, 240, 0.04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1720; --surface: #16212C; --ink: #E3EAF0; --muted: #93A3B3; --line: #2A3947;
  --accent: #5FC497; --accent-ink: #0B1B13; --accent-soft: #183A2C; --error: #F08A74; --error-soft: #3A1F1A;
  --code-bg: #0E1821; --out-bg: #070D13; --out-ink: #CFE0D7; --grid: rgba(227, 234, 240, 0.04);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; font-family: var(--sans); font-size: 17px; line-height: 1.55; color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, pre, textarea { font-family: var(--mono); }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; }

.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; padding: 28px 20px 24px; border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 85%, transparent);
}
.brand { font-weight: 700; font-size: 1.2rem; margin: 0 0 2px; }
.brand-sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 22px; }
.progress-label { font-size: 0.85rem; color: var(--muted); }
.progress-num { font-family: var(--mono); font-size: 2rem; font-weight: 600; line-height: 1.15; }
.bar { height: 8px; border-radius: 4px; background: var(--code-bg); border: 1px solid var(--line); overflow: hidden; margin: 8px 0 6px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
.progress-note { font-size: 0.85rem; color: var(--muted); }
.modlist { list-style: none; padding: 0; margin: 0; }
.mod-btn { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; }
.mod-btn:hover { background: var(--surface); }
.mod-btn[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.mod-n { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.mod-count { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.mod-count.full { color: var(--accent); font-weight: 600; }
.engine { margin-top: 20px; font-size: 0.82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #C9A227; flex: none; }
.dot.ok { background: var(--accent); }
.dot.bad { background: var(--error); }
.reset { margin-top: 14px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.82rem; text-decoration: underline; }

main { padding: 32px 40px 80px; min-width: 0; }
.lesson-head h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
.lesson-head p { margin: 0; color: var(--muted); max-width: 62ch; }

.learn { margin: 22px 0 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.learn > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.learn > summary::-webkit-details-marker { display: none; }
.learn > summary::after { content: "Show"; font-weight: 400; font-size: 0.85rem; color: var(--muted); text-decoration: underline; }
.learn[open] > summary::after { content: "Hide"; }
.learn-body { padding: 4px 18px 18px; }
.block { padding: 14px 0; border-top: 1px solid var(--line); max-width: 72ch; }
.block:first-child { border-top: 0; padding-top: 4px; }
.block-step { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
.block p { margin: 0 0 8px; }
.block p:last-child { margin-bottom: 0; }
.sample { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 10px 0 6px; font-size: 14px; }
.sample pre { margin: 0; padding: 10px 12px; white-space: pre; overflow-x: auto; }
.sample .s-code { background: var(--code-bg); }
.sample .s-out { background: var(--out-bg); color: var(--out-ink); }
.sample .s-tag { display: block; font-family: var(--sans); font-size: 0.72rem; opacity: 0.7; margin-bottom: 4px; }
.sample.solo, .sample.stack { grid-template-columns: 1fr; }
.s-img { background: #FFFFFF; padding: 10px 12px; color: #18263A; }
.s-imgtext { margin: 0 0 8px; font-size: 14px; white-space: pre-wrap; }
.s-img img, .plots img { display: block; max-width: 100%; height: auto; }
.plots { background: #FFFFFF; }
.plots:empty { display: none; }
.plots img { padding: 10px 14px; }
code.i { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 0.88em; white-space: nowrap; }
.tip { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.try-head { margin: 18px 0 8px; font-weight: 700; }

.ex-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; }
.step { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 0.85rem; display: grid; place-items: center; }
.step[aria-current="true"] { border-color: var(--ink); border-width: 2px; }
.step.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-title { font-size: 1.3rem; margin: 0; }

.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; max-width: 78ch; }
.task p { margin: 0 0 8px; }
.task p:last-child { margin-bottom: 0; }

.editor-wrap { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.editor-wrap:focus-within { border-color: var(--accent); }
.editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 12px; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--line); }
textarea.code { display: block; width: 100%; min-height: 160px; resize: vertical; border: 0; outline: none; padding: 14px 16px; background: transparent; color: var(--ink); font-size: 15px; line-height: 1.55; tab-size: 4; white-space: pre; overflow-x: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.btn { border-radius: 8px; padding: 9px 16px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 0.95rem; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; font-weight: 400; text-decoration: underline; padding-left: 6px; padding-right: 6px; }
.btn:disabled { opacity: 0.5; cursor: default; }

.console { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.console-head { padding: 8px 14px; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid var(--line); }
.console pre { margin: 0; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 48px; max-height: 320px; overflow: auto; }
.console.pass { border-color: var(--accent); }
.console.pass .console-head { background: var(--accent-soft); }
.console.fail .console-head { background: var(--error-soft); }
.verdict { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 0.95rem; }
.verdict.pass { color: var(--accent); font-weight: 700; }
.verdict.fail { color: var(--error); }
.err-line { color: var(--error); }

.helper { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); max-width: 78ch; }
.helper h3 { font-size: 0.95rem; margin: 0 0 6px; }
.helper p { margin: 0; }
.helper pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; margin: 8px 0 0; }

.next-row { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
.finish { background: var(--accent-soft); border-radius: 12px; padding: 18px 20px; margin-top: 22px; max-width: 78ch; }
.finish h2 { margin: 0 0 6px; font-size: 1.2rem; }
.finish p { margin: 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 18px 16px 12px; }
  .progress { padding: 10px 12px; margin-bottom: 12px; }
  .progress-num { font-size: 1.5rem; }
  .modlist { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .mod-btn { white-space: nowrap; grid-template-columns: auto auto auto; }
  .mod-btn[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  main { padding: 22px 16px 60px; }
  .lesson-head h1 { font-size: 1.6rem; }
  .sample { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Lessons">
    <p class="brand">SciPy from Zero</p>
    <p class="brand-sub">Learn scientific computing by typing, one small step at a time. Know basic Python, NumPy and Matplotlib first.</p>
    <div class="progress" aria-live="polite">
      <div class="progress-label">Progress</div>
      <div class="progress-num" id="pct">0%</div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="progress-note" id="pct-note">0 exercises solved</div>
    </div>
    <ul class="modlist" id="modlist"></ul>
    <div class="engine"><span class="dot" id="engine-dot"></span><span id="engine-text">Starting Python and SciPy…</span></div>
    <button class="reset" id="reset">Reset all progress</button>
  </aside>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
const PRELUDE = "\nimport numpy as np\nimport matplotlib.pyplot as plt\ndef expect(cond, msg):\n    if not cond:\n        raise AssertionError(msg)\ndef near(a, b, tol=1e-6):\n    try:\n        return abs(float(a) - float(b)) <= tol\n    except Exception:\n        return False\ndef rel(a, b, r=1e-3):\n    try:\n        return abs(float(a) - float(b)) <= r * max(abs(float(b)), 1e-12)\n    except Exception:\n        return False\ndef defined(name):\n    return name in globals()\ndef same(a, b, tol=1e-6):\n    try:\n        a = np.asarray(a, dtype=float).ravel()\n        b = np.asarray(b, dtype=float).ravel()\n        return a.shape == b.shape and bool(np.allclose(a, b, atol=tol))\n    except Exception:\n        return False\n";

const MODULES = [{"id": "s1", "title": "Meet SciPy", "blurb": "A toolbox of ready-made scientific methods, built on NumPy.", "learn": [{"t": "<p><b>SciPy<\/b> (short for Scientific Python) is a big toolbox of methods scientists and engineers use all the time: statistics, fitting curves to data, cleaning noisy signals, finding areas under curves, solving equations, and more.<\/p><p>It’s built on NumPy, so it works directly with arrays. You don’t need to know the maths inside each method, just when to use it and what it gives back.<\/p>"}, {"t": "<p>SciPy is split into <b>parts<\/b> (called submodules), one per topic. You import just the part you need:<\/p><p><code class='i'>from scipy import stats<\/code> for statistics, <code class='i'>from scipy import optimize<\/code> for fitting and solving, <code class='i'>from scipy import signal<\/code> for signals, and so on.<\/p><p>Let’s start with an easy one: <code class='i'>constants<\/code>, which holds precise values of physical constants.<\/p>", "code": "from scipy import constants\n\nprint(constants.c)      # speed of light (m/s)\nprint(constants.R)      # gas constant (J/mol/K)\nprint(constants.N_A)    # Avogadro's number (1/mol)", "out": "299792458.0\n8.31446261815324\n6.02214076e+23", "img": ""}, {"t": "<p>Using constants from SciPy instead of typing them saves mistakes and gives you full precision. Example: the pressure of 1 mole of gas in 0.025 m³ at 300 K, from the ideal gas law P = nRT / V.<\/p>", "code": "from scipy import constants\n\nn = 1\nT = 300\nV = 0.025\nP = n * constants.R * T / V\nprint(f\"{P:.0f} Pa\")", "out": "99774 Pa", "img": ""}, {"t": "<p>Some constants live in a bigger dictionary, <code class='i'>physical_constants<\/code>, which also tells you the units. Each entry gives three things: the value, the unit, and the uncertainty. Use <code class='i'>[0]<\/code> to get just the value.<\/p>", "code": "from scipy import constants\n\nF = constants.physical_constants[\"Faraday constant\"]\nprint(F)\nprint(F[0])", "out": "(96485.33212331001, 'C mol^-1', 0.0)\n96485.33212331001", "img": ""}, {"t": "<p><code class='i'>constants.convert_temperature(values, from, to)<\/code> converts between units like <code class='i'>\"Celsius\"<\/code>, <code class='i'>\"Kelvin\"<\/code> and <code class='i'>\"Fahrenheit\"<\/code>. Like most of SciPy, it works on whole arrays at once.<\/p>", "code": "import numpy as np\nfrom scipy import constants\n\ntemps_c = np.array([0, 25, 100])\nprint(constants.convert_temperature(temps_c, \"Celsius\", \"Kelvin\"))", "out": "[273.15 298.15 373.15]", "img": ""}], "playground": "from scipy import constants\n\nprint(constants.g)                      # gravity (m/s²)\nprint(constants.k)                      # Boltzmann constant (J/K)\nprint(constants.convert_temperature(37, \"Celsius\", \"Fahrenheit\"))", "exercises": [{"id": "1a", "title": "Thermal voltage", "task": "<p>In electrochemistry, the <b>thermal voltage<\/b> is V = R × T ÷ F. Calculate it at T = 298.15 K and store it in <code class='i'>vt<\/code>.<\/p><p>Use <code class='i'>constants.R<\/code> and the Faraday constant from <code class='i'>physical_constants<\/code>.<\/p>", "starter": "from scipy import constants\n\nT = 298.15\n", "hint": "F = constants.physical_constants[\"Faraday constant\"][0], then vt = constants.R * T / F", "solution": "from scipy import constants\n\nT = 298.15\nF = constants.physical_constants[\"Faraday constant\"][0]\nvt = constants.R * T / F\nprint(vt)", "check": "expect(defined(\"vt\"), \"Store the answer in vt\")\nexpect(near(vt, 0.0256926, 1e-6), \"vt should be about 0.02569 V. Check you used R × T ÷ F\")\nexpect(\"constants.\" in __code__, \"Use the constants from SciPy instead of typing the numbers\")"}, {"id": "1b", "title": "Counting molecules", "task": "<p>How many molecules are in 0.5 moles of water? Multiply by Avogadro’s number and store the result in <code class='i'>n_molecules<\/code>.<\/p>", "starter": "from scipy import constants\n\nmoles = 0.5\n", "hint": "n_molecules = moles * constants.N_A", "solution": "from scipy import constants\n\nmoles = 0.5\nn_molecules = moles * constants.N_A\nprint(n_molecules)", "check": "expect(defined(\"n_molecules\") and rel(n_molecules, 3.01107038e23), \"n_molecules should be about 3.011 × 10²³\")"}, {"id": "1c", "title": "Convert a whole array", "task": "<p>Convert all the temperatures from Celsius to Kelvin in one step. Store them in <code class='i'>temps_k<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy import constants\n\ntemps_c = np.array([-20, 0, 25, 60, 100])\n", "hint": "constants.convert_temperature(temps_c, \"Celsius\", \"Kelvin\")", "solution": "import numpy as np\nfrom scipy import constants\n\ntemps_c = np.array([-20, 0, 25, 60, 100])\ntemps_k = constants.convert_temperature(temps_c, \"Celsius\", \"Kelvin\")\nprint(temps_k)", "check": "expect(\"convert_temperature\" in __code__, \"Use constants.convert_temperature\")\nexpect(defined(\"temps_k\") and same(temps_k, [253.15, 273.15, 298.15, 333.15, 373.15]), \"temps_k should start at 253.15 and end at 373.15\")"}]}, {"id": "s2", "title": "Probability", "blurb": "Use the bell curve to answer “how likely is this?”", "learn": [{"t": "<p>Many real measurements, like heights, test scores or manufacturing sizes, follow a <b>normal distribution<\/b>: the famous bell curve. Most values sit near the middle, and fewer appear further away.<\/p><p>It’s described by two numbers: the <b>mean<\/b> (the centre) and the <b>standard deviation<\/b> (how spread out it is). In SciPy, <code class='i'>stats.norm(mean, sd)<\/code> creates one.<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nheights = stats.norm(170, 8)\nx = np.linspace(140, 200, 200)\nplt.plot(x, heights.pdf(x))\nplt.xlabel(\"Height (cm)\")\nplt.title(\"Mean 170 cm, standard deviation 8 cm\")\nplt.show()", "out": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXkAAAEVCAYAAAAFNZUcAAAAOnRFWHRTb2Z0d2FyZQBNY from scipy import stats\n\nheights = stats.norm(170, 8)\nprint(f\"90th percentile: {heights.ppf(0.9):.1f} cm\")\nprint(f\"Median: {heights.ppf(0.5):.1f} cm\")", "out": "90th percentile: 180.3 cm\nMedian: 170.0 cm", "img": ""}, {"t": "<p class='tip'><b>Rule of thumb:<\/b> in a normal distribution, about 68% of values are within 1 standard deviation of the mean, and about 95% are within 2. Try checking that with <code class='i'>.cdf()<\/code> in the playground.<\/p>"}], "playground": "from scipy import stats\n\nscores = stats.norm(65, 10)\nprint(scores.cdf(75) - scores.cdf(55))   # within 1 standard deviation\nprint(scores.cdf(85) - scores.cdf(45))   # within 2", "exercises": [{"id": "2a", "title": "Below spec", "task": "<p>A factory makes batteries with capacities that follow a normal distribution: mean 3000 mAh, standard deviation 50 mAh.<\/p><p>What fraction of batteries are below 2900 mAh? Store it in <code class='i'>p_low<\/code>.<\/p>", "starter": "from scipy import stats\n", "hint": "batteries = stats.norm(3000, 50), then p_low = batteries.cdf(2900)", "solution": "from scipy import stats\n\nbatteries = stats.norm(3000, 50)\np_low = batteries.cdf(2900)\nprint(f\"{p_low:.2%}\")", "check": "expect(defined(\"p_low\") and near(p_low, 0.0227501, 1e-6), \"p_low should be about 0.0228 (2.28%)\")"}, {"id": "2b", "title": "Within range", "task": "<p>Same batteries. What fraction are between 2950 and 3050 mAh? Store it in <code class='i'>p_ok<\/code>.<\/p>", "starter": "from scipy import stats\n\nbatteries = stats.norm(3000, 50)\n", "hint": "cdf of the upper value minus cdf of the lower value", "solution": "from scipy import stats\n\nbatteries = stats.norm(3000, 50)\np_ok = batteries.cdf(3050) - batteries.cdf(2950)\nprint(f\"{p_ok:.1%}\")", "check": "expect(defined(\"p_ok\") and near(p_ok, 0.6826895, 1e-6), \"p_ok should be about 0.683 (68.3%)\")"}, {"id": "2c", "title": "Top 1%", "task": "<p>Only the top 1% of batteries get a “premium” label. What’s the minimum capacity for that? Store it in <code class='i'>premium_min<\/code>.<\/p>", "starter": "from scipy import stats\n\nbatteries = stats.norm(3000, 50)\n", "hint": "The top 1% starts where 99% are below: batteries.ppf(0.99)", "solution": "from scipy import stats\n\nbatteries = stats.norm(3000, 50)\npremium_min = batteries.ppf(0.99)\nprint(f\"{premium_min:.1f} mAh\")", "check": "expect(\"ppf\" in __code__, \"Use .ppf()\")\nexpect(defined(\"premium_min\") and near(premium_min, 3116.3174, 1e-3), \"premium_min should be about 3116.3 mAh\")"}]}, {"id": "s3", "title": "Comparing groups", "blurb": "Is a difference real, or just random noise?", "learn": [{"t": "<p>Say you test two batches of a product, and batch B scores a bit higher on average. Is B really better, or did it just get lucky? Measurements always vary a little, so you can’t tell just by looking at the averages.<\/p><p>A <b>t-test<\/b> helps answer this. <code class='i'>stats.ttest_ind(a, b)<\/code> compares two independent groups.<\/p>", "code": "from scipy import stats\n\nbatch_a = [71, 74, 69, 73, 72, 70, 75]\nbatch_b = [76, 78, 74, 79, 77, 75, 80]\nresult = stats.ttest_ind(batch_a, batch_b)\nprint(f\"p-value: {result.pvalue:.5f}\")", "out": "p-value: 0.00098", "img": ""}, {"t": "<p>The key number is the <b>p-value<\/b>. In plain words, it answers: “If there were <b>no real difference<\/b>, how surprising would results this different be?”<\/p><p>A <b>small<\/b> p-value (commonly below 0.05) means the results would be very surprising by chance alone, so the difference is probably real. A <b>large<\/b> p-value means random variation could easily explain it.<\/p><p class='tip'>A small p-value doesn’t tell you the difference is <b>big<\/b> or important, only that it’s probably not luck. Always look at the actual averages too.<\/p>"}, {"t": "<p>Here the groups overlap a lot, so the p-value is large. We can’t say they’re different.<\/p>", "code": "from scipy import stats\n\nbatch_a = [71, 74, 69, 73, 72, 70, 75]\nbatch_c = [72, 70, 75, 71, 74, 73, 71]\nprint(f\"p-value: {stats.ttest_ind(batch_a, batch_c).pvalue:.3f}\")", "out": "p-value: 0.793", "img": ""}, {"t": "<p>A different question: do two measurements <b>move together<\/b>? <code class='i'>stats.pearsonr(x, y)<\/code> gives the <b>correlation<\/b> r, from −1 to 1.<\/p><p>Near 1: when one goes up, the other goes up. Near −1: one up, the other down. Near 0: no straight-line relationship.<\/p>", "code": "from scipy import stats\n\ntemperature = [18, 21, 24, 27, 30, 33]\nice_creams = [120, 150, 210, 260, 320, 400]\nr, p = stats.pearsonr(temperature, ice_creams)\nprint(f\"r = {r:.3f}\")", "out": "r = 0.992", "img": ""}, {"t": "<p class='tip'><b>Correlation is not causation.<\/b> Ice cream sales and sunburns are strongly correlated, but ice cream doesn’t cause sunburn. Hot weather causes both.<\/p>"}], "playground": "from scipy import stats\n\nhours_sleep = [5, 6, 6.5, 7, 7.5, 8, 9]\ntest_score = [58, 62, 66, 70, 71, 75, 74]\nr, p = stats.pearsonr(hours_sleep, test_score)\nprint(f\"r = {r:.2f}, p = {p:.3f}\")", "exercises": [{"id": "3a", "title": "Two catalysts", "task": "<p>Two catalysts were each tested 6 times. Run a t-test and store the p-value in <code class='i'>p<\/code>.<\/p>", "starter": "from scipy import stats\n\ncatalyst_1 = [312, 305, 318, 309, 315, 311]\ncatalyst_2 = [298, 301, 295, 303, 299, 296]\n", "hint": "p = stats.ttest_ind(catalyst_1, catalyst_2).pvalue", "solution": "from scipy import stats\n\ncatalyst_1 = [312, 305, 318, 309, 315, 311]\ncatalyst_2 = [298, 301, 295, 303, 299, 296]\np = stats.ttest_ind(catalyst_1, catalyst_2).pvalue\nprint(p)", "check": "from scipy import stats as _st\nexpect(defined(\"p\"), \"Store the p-value in p\")\nexpect(rel(p, _st.ttest_ind(catalyst_1, catalyst_2).pvalue, 1e-6), \"p should be the .pvalue from stats.ttest_ind(catalyst_1, catalyst_2)\")"}, {"id": "3b", "title": "Real or noise?", "task": "<p>Run a t-test on these two groups. Store the p-value in <code class='i'>p<\/code>, and store <code class='i'>True<\/code> or <code class='i'>False<\/code> in <code class='i'>different<\/code>: True if p is below 0.05.<\/p><p>Let the code decide. Don’t type True or False yourself.<\/p>", "starter": "from scipy import stats\n\nold_recipe = [8.1, 7.9, 8.4, 8.0, 8.3, 7.8, 8.2]\nnew_recipe = [8.3, 8.0, 8.1, 8.5, 7.9, 8.2, 8.4]\n", "hint": "different = p < 0.05 (the comparison itself gives True or False)", "solution": "from scipy import stats\n\nold_recipe = [8.1, 7.9, 8.4, 8.0, 8.3, 7.8, 8.2]\nnew_recipe = [8.3, 8.0, 8.1, 8.5, 7.9, 8.2, 8.4]\np = stats.ttest_ind(old_recipe, new_recipe).pvalue\ndifferent = p < 0.05\nprint(p, different)", "check": "from scipy import stats as _st\nexpect(defined(\"p\") and rel(p, _st.ttest_ind(old_recipe, new_recipe).pvalue, 1e-6), \"p should come from stats.ttest_ind\")\nexpect(defined(\"different\") and bool(different) == False, \"With this p-value, different should be False\")\nexpect(\"< 0.05\" in __code__ or \"<0.05\" in __code__, \"Let the code decide with p < 0.05\")"}, {"id": "3c", "title": "Do they move together?", "task": "<p>Calculate the correlation between study <code class='i'>hours<\/code> and <code class='i'>score<\/code>. Store r in <code class='i'>r<\/code>.<\/p>", "starter": "from scipy import stats\n\nhours = [1, 2, 3, 4, 5, 6, 7, 8]\nscore = [52, 55, 61, 60, 68, 72, 75, 83]\n", "hint": "r, p = stats.pearsonr(hours, score)", "solution": "from scipy import stats\n\nhours = [1, 2, 3, 4, 5, 6, 7, 8]\nscore = [52, 55, 61, 60, 68, 72, 75, 83]\nr, p = stats.pearsonr(hours, score)\nprint(r)", "check": "from scipy import stats as _st\nexpect(defined(\"r\") and near(r, _st.pearsonr(hours, score)[0], 1e-9), \"r should be the correlation from stats.pearsonr(hours, score)\")"}]}, {"id": "s4", "title": "Straight-line fits", "blurb": "Find the best line through your data, and use it.", "learn": [{"t": "<p>Real data never sits perfectly on a line. A <b>linear fit<\/b> (also called linear regression) finds the straight line that passes as close as possible to all the points: <b>y = slope × x + intercept<\/b>.<\/p><p><code class='i'>stats.linregress(x, y)<\/code> does it, and gives back <code class='i'>.slope<\/code>, <code class='i'>.intercept<\/code> and <code class='i'>.rvalue<\/code>.<\/p>", "code": "from scipy import stats\n\nx = [1, 2, 3, 4, 5]\ny = [2.1, 3.9, 6.2, 7.8, 10.1]\nfit = stats.linregress(x, y)\nprint(f\"slope = {fit.slope:.3f}\")\nprint(f\"intercept = {fit.intercept:.3f}\")", "out": "slope = 1.990\nintercept = 0.050", "img": ""}, {"t": "<p><b>R²<\/b> (r-squared) tells you how well the line fits, from 0 to 1. It’s <code class='i'>fit.rvalue ** 2<\/code>. Close to 1 means the points sit very close to the line. Calibration curves in labs usually need R² above 0.99.<\/p>", "code": "from scipy import stats\n\nfit = stats.linregress([1, 2, 3, 4, 5], [2.1, 3.9, 6.2, 7.8, 10.1])\nprint(f\"R² = {fit.rvalue ** 2:.4f}\")", "out": "R² = 0.9973", "img": ""}, {"t": "<p>To draw the line, calculate y from the slope and intercept, and plot it over the points.<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nx = np.array([1, 2, 3, 4, 5])\ny = np.array([2.1, 3.9, 6.2, 7.8, 10.1])\nfit = stats.linregress(x, y)\nplt.scatter(x, y, label=\"Data\")\nplt.plot(x, fit.slope * x + fit.intercept, color=\"red\", label=\"Fit\")\nplt.legend()\nplt.show()", "out": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAW4AAAD0CAYAAAC7KMweAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAKxxJREFUeJzt3XlAlNX+x/E3KCqh5L5npiK4gKJI7lpaXK3cza7LrTRxK7dEQ6/mllSouZE62m1xy1JB9LrvezaKimzuImiFKSqKiPD8/jg3yh9oDszMMwPf1z8XeB7ufBzp65dzznOOg6ZpGkIIIeyGo94BhBBCmEYKtxBC2Bkp3EIIYWekcAshhJ2Rwi2EEHZGCrcQQtiZwtZ4kbJly1K9enVrvJQQQuQLly5d4vr16zles0rhrl69Okaj0RovJYQQ+YKPj89jr8lQiRBC2Bkp3EIIYWekcAshhJ2xyhh3TtLT00lISOD+/ft6RbCoYsWKUbVqVZycnPSOIoTIZ3Qr3AkJCZQoUYLq1avj4OCgVwyL0DSN33//nYSEBF544QW94wgh8hndCvf9+ CilSpXK+nvbsGEDV65coUOHDjlO+lrCzz//zIEDB6hQoQLdu3enaNGiREdHc//+fRo1agTApk2bOHPmDG3btqVhw4ZWyfWHqKgoAOrVq8f58+dJSkqiadOmgCrwx48fp1WrVlbPdenSJX777Td8fX355ZdfiIqKol27doDqaI8cOULDhg0tPqz0h/j4eMLDwyldujQ9evSgSJEi2f4ed+3aRXR0NC+//DJ169bN0+vZVOEWQgjx92x+jFsIIcSjpHALIYSdkcIthBB2Rgq3EELYGSncQghhZ6RwCyGEnZHCLYQQdkYKtxBC2Jn/A+vjQsSiRWFrAAAAAElFTkSuQmCC"}, {"t": "<p>A classic use is a <b>calibration curve<\/b>. You measure some standards with known concentrations, fit a line, and then use it backwards to find the concentration of an unknown sample:<\/p><p>concentration = (signal − intercept) ÷ slope<\/p>", "code": "from scipy import stats\n\nconc = [0, 2, 4, 6, 8]                    # mg/L\nabsorbance = [0.01, 0.21, 0.40, 0.61, 0.79]\nfit = stats.linregress(conc, absorbance)\n\nunknown = 0.50\nc = (unknown - fit.intercept) / fit.slope\nprint(f\"Unknown sample: {c:.2f} mg/L\")", "out": "Unknown sample: 4.98 mg/L", "img": ""}], "playground": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nyears = np.array([2019, 2020, 2021, 2022, 2023])\nusers = np.array([1.2, 1.9, 2.4, 3.1, 3.7])\nfit = stats.linregress(years, users)\nprint(f\"Growth: {fit.slope:.2f} million users per year\")\nplt.scatter(years, users)\nplt.plot(years, fit.slope * years + fit.intercept, color=\"red\")\nplt.show()", "exercises": [{"id": "4a", "title": "Fit a calibration line", "task": "<p>Fit a straight line to the calibration data. Store the slope in <code class='i'>slope<\/code> and the intercept in <code class='i'>intercept<\/code>.<\/p>", "starter": "from scipy import stats\n\nconc = [0, 1, 2, 4, 6, 8]          # mmol/L\nsignal = [0.02, 0.15, 0.31, 0.58, 0.88, 1.17]\n", "hint": "fit = stats.linregress(conc, signal), then fit.slope and fit.intercept", "solution": "from scipy import stats\n\nconc = [0, 1, 2, 4, 6, 8]          # mmol/L\nsignal = [0.02, 0.15, 0.31, 0.58, 0.88, 1.17]\nfit = stats.linregress(conc, signal)\nslope = fit.slope\nintercept = fit.intercept\nprint(slope, intercept)", "check": "from scipy import stats as _st\n_f = _st.linregress(conc, signal)\nexpect(defined(\"slope\") and near(slope, _f.slope, 1e-9), \"slope should come from stats.linregress(conc, signal)\")\nexpect(defined(\"intercept\") and near(intercept, _f.intercept, 1e-9), \"intercept should come from the same fit\")"}, {"id": "4b", "title": "Is it good enough?", "task": "<p>Calculate R² for the same calibration and store it in <code class='i'>r_squared<\/code>. Then store <code class='i'>True<\/code> in <code class='i'>good<\/code> if R² is above 0.99, using a comparison.<\/p>", "starter": "from scipy import stats\n\nconc = [0, 1, 2, 4, 6, 8]\nsignal = [0.02, 0.15, 0.31, 0.58, 0.88, 1.17]\nfit = stats.linregress(conc, signal)\n", "hint": "r_squared = fit.rvalue ** 2, then good = r_squared > 0.99", "solution": "from scipy import stats\n\nconc = [0, 1, 2, 4, 6, 8]\nsignal = [0.02, 0.15, 0.31, 0.58, 0.88, 1.17]\nfit = stats.linregress(conc, signal)\nr_squared = fit.rvalue ** 2\ngood = r_squared > 0.99\nprint(r_squared, good)", "check": "expect(defined(\"r_squared\") and near(r_squared, fit.rvalue ** 2, 1e-12), \"r_squared should be fit.rvalue ** 2\")\nexpect(defined(\"good\") and bool(good) == True, \"good should be True for this data\")\nexpect(\"0.99\" in __code__, \"Let the code decide with r_squared > 0.99\")"}, {"id": "4c", "title": "Find the unknown", "task": "<p>An unknown sample gave a signal of 0.72. Use the calibration line to find its concentration, and store it in <code class='i'>unknown_conc<\/code>.<\/p>", "starter": "from scipy import stats\n\nconc = [0, 1, 2, 4, 6, 8]\nsignal = [0.02, 0.15, 0.31, 0.58, 0.88, 1.17]\nfit = stats.linregress(conc, signal)\nunknown_signal = 0.72\n", "hint": "(unknown_signal - fit.intercept) / fit.slope", "solution": "from scipy import stats\n\nconc = [0, 1, 2, 4, 6, 8]\nsignal = [0.02, 0.15, 0.31, 0.58, 0.88, 1.17]\nfit = stats.linregress(conc, signal)\nunknown_signal = 0.72\nunknown_conc = (unknown_signal - fit.intercept) / fit.slope\nprint(f\"{unknown_conc:.2f} mmol/L\")", "check": "expect(defined(\"unknown_conc\") and near(unknown_conc, (0.72 - fit.intercept) / fit.slope, 1e-9), \"Use (signal - intercept) / slope\")"}]}, {"id": "s5", "title": "Curve fitting", "blurb": "Fit any formula to your data and get its parameters.", "learn": [{"t": "<p>Lots of science isn’t a straight line: things decay, grow, level off. <code class='i'>curve_fit<\/code> fits <b>any formula<\/b> you choose to your data, and finds the best values for its unknown parameters.<\/p><p><b>Step 1:<\/b> write your formula as a Python function. The first input is x. After that come the unknowns you want to find. Here: exponential decay, y = A × e<sup>−k·t<\/sup>.<\/p>", "code": "import numpy as np\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n\nprint(decay(0, 100, 0.5))\nprint(decay(2, 100, 0.5))", "out": "100.0\n36.787944117144235", "img": ""}, {"t": "<p><b>Step 2:<\/b> give <code class='i'>curve_fit<\/code> your function and data. It gives back two things: <code class='i'>popt<\/code>, the best values for your parameters (in the same order as in your function), and <code class='i'>pcov<\/code>, which we use for uncertainties in a moment.<\/p>", "code": "import numpy as np\nfrom scipy.optimize import curve_fit\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n\nt = np.array([0, 1, 2, 3, 4, 5, 6])\ny = np.array([98, 62, 35, 23, 14, 8, 5])\npopt, pcov = curve_fit(decay, t, y)\nA, k = popt\nprint(f\"A = {A:.1f}, k = {k:.3f}\")", "out": "A = 98.5, k = 0.492", "img": ""}, {"t": "<p><b>Step 3:<\/b> always plot the fit over your data to check it makes sense. Use many x values for a smooth curve.<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import curve_fit\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n\nt = np.array([0, 1, 2, 3, 4, 5, 6])\ny = np.array([98, 62, 35, 23, 14, 8, 5])\npopt, pcov = curve_fit(decay, t, y)\n\nt_smooth = np.linspace(0, 6, 100)\nplt.scatter(t, y, label=\"Data\")\nplt.plot(t_smooth, decay(t_smooth, *popt), color=\"red\", label=\"Fit\")\nplt.legend()\nplt.show()", "out": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXQAAAD0CAYAAACLpN0/AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAJqlJREFUeJzt3Xt8z3X/x/HH12xtGEMubMOkbQ7b2GWXFEqEhMghWYgwmlCuFhNGKmq6rurqcDWK1FVK2E9KKIeQMDleOTU57OAyNHPYHGa/P95Mctz23T77fve8326f23y/+x5eH7dbT5/en9f7/bbl5OTkICIiDq+U1QWIiIh9KNBFRJyEAl1ExEko0EVEnIQCXUTESSjQRUScRGkrv/z222/Hz8/PyhJERBzOvn37OHLkyFXPWxrofn5+JCQkWFmCiIjDCQsLu+bzGnIREXESCnQRESdx00BfsGABDRo0YM6cOQCkpaXx8MMPExISwoABA8jKygIgJyeHsWPH0rBhQ1q2bMmuXbsKt3IREbnCDcfQv//+ez788EPuu+8+MjIyAHj66afp1asXvXr1Yvz48UyZMoUJEyYwe/ZsEhMT2bx5Mxs2bCA8PJyNGzcWyUmISMlz7tw5kpKSci8qnZG7uzu+vr64urre0utvGOiNGzcmPj6ecePGAZCdnc26deuYPXs2ACNGjODee+9lwoQJzJkzh1GjRmGz2WjSpAllypRhz549+Pv7F/CURESulpSUhKenJ35+fthsNqvLsbucnByOHj1KUlIStWvXvqX33HDIxcvL64rHhw4donr16rl/eZUrVyY9PR2AgwcPXtGC6Ofnx8GDB6/6zLi4OMLCwggLCyMtLe2WihQR+bOsrCwqV67slGEOYLPZqFy5cp7+DyRPbYtly5a94sNzcnJwcXG55u8yMzMpW7bsVZ8RERFBREQEcP3WmxuJ35TMmwu34rZvLyf96xHVLpAuoT55/hwRcXzOGuaX5PX88tTl4uXlxYkTJzh+/DgAmzZtIjAwEICgoCB++uknwAT91q1b7T7cEr8pmeh523jhoximz53E4aMZRM/bRvymZLt+j4iII8pz2+LIkSPp2bMnH3/8MYMHDyYqKgowN0tffPFFZsyYQf/+/Wnfvj2VKlWya7Gxi3eReS6bj//akRrH/0fPLUvIPJdN7GJ11IiI3NKQS8eOHfH09AQgMjISf39/Nm/ezHvvvZc7bFK3bl3mz5/PwoUL6dChA927d7d7sSnpmQCsrP1X1vvWZ9jaz/kyuDUp6Xb/KhGRG0pJSSE2NhaAChUq0KRJEx566KEbvic7O5vs7Gzc3NwKpaZbukK/6667qF+/fu7jNm3aEBUVddUYeEBAACNHjqRHjx6FMrbl7eVh/mCzMfXevlQ9eYw+P39z+XkRkSKSlpbG8uXL6dixIw0aNGDmzJn07t37hu9ZuHAho0aNKrSaHGqmaFS7QDxczU3Y9TWC+MEvlMh1XxLdXDdFReTG4jcl02zKMmqP/ppmU5bZ5d5bxYoVad26NT169OCLL77gyJEjLF++HDCTMjt06ECPHj1Ys2YNKSkpjB8/nrlz5xITEwPAp59+yoMPPkh4eDibN28ucD0OFehdQn2Y3DUYHy8PbMBHDw2kYmYGHZd/YXVpIlKMXWqoSE7PJAdITs8slIaKjh07sm7dOk6dOsWiRYuYNm0aMTExDBgwAG9vb2JiYnjkkUeIiYnh6NGjrF27llmzZhEZGcmQIUMK/P2WrraYH11Cfa5sU0xeAlOnQmQkVK5sXWEiUmxdaqj4o0sNFfZsey5dujRnz56lbNmyv e order as your parameters.<\/p>", "code": "import numpy as np\nfrom scipy.optimize import curve_fit\n\ndef growth(t, N0, r):\n    return N0 * np.exp(r * t)\n\nt = np.array([0, 10, 20, 30, 40])\nn = np.array([1000, 1650, 2700, 4500, 7400])\npopt, pcov = curve_fit(growth, t, n, p0=[1000, 0.05])\nprint(f\"N0 = {popt[0]:.0f}, r = {popt[1]:.4f}\")", "out": "N0 = 997, r = 0.0501", "img": ""}, {"t": "<p><b>Uncertainties:<\/b> each fitted value has some uncertainty. Get the standard errors with <code class='i'>np.sqrt(np.diag(pcov))<\/code>, in the same order as your parameters. Report results as value ± error.<\/p>", "code": "import numpy as np\nfrom scipy.optimize import curve_fit\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n\nt = np.array([0, 1, 2, 3, 4, 5, 6])\ny = np.array([98, 62, 35, 23, 14, 8, 5])\npopt, pcov = curve_fit(decay, t, y)\nerrors = np.sqrt(np.diag(pcov))\nprint(f\"k = {popt[1]:.3f} ± {errors[1]:.3f}\")", "out": "k = 0.492 ± 0.010", "img": ""}], "playground": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.optimize import curve_fit\n\ndef line(x, m, b):\n    return m * x + b\n\nx = np.array([0, 1, 2, 3, 4])\ny = np.array([1.1, 2.9, 5.2, 6.8, 9.1])\npopt, pcov = curve_fit(line, x, y)\nprint(popt)\nplt.scatter(x, y)\nplt.plot(x, line(x, *popt), color=\"red\")\nplt.show()", "exercises": [{"id": "5a", "title": "Fit a decay", "task": "<p>A first-order reaction follows c = A × e<sup>−k·t<\/sup>. Write the function <code class='i'>decay(t, A, k)<\/code>, fit it to the data, and store the results in <code class='i'>A_fit<\/code> and <code class='i'>k_fit<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy.optimize import curve_fit\n\nt = np.array([0, 2, 4, 6, 8, 10, 12])                 # minutes\nc = np.array([1.00, 0.67, 0.45, 0.31, 0.20, 0.14, 0.09])  # mol/L\n", "hint": "def decay(t, A, k): return A * np.exp(-k * t). Then popt, pcov = curve_fit(decay, t, c) and A_fit, k_fit = popt", "solution": "import numpy as np\nfrom scipy.optimize import curve_fit\n\nt = np.array([0, 2, 4, 6, 8, 10, 12])                 # minutes\nc = np.array([1.00, 0.67, 0.45, 0.31, 0.20, 0.14, 0.09])  # mol/L\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n\npopt, pcov = curve_fit(decay, t, c)\nA_fit, k_fit = popt\nprint(A_fit, k_fit)", "check": "from scipy.optimize import curve_fit as _cf\n_p, _ = _cf(lambda tt, A, k: A * np.exp(-k * tt), t, c)\nexpect(defined(\"decay\"), \"Define the function decay(t, A, k)\")\nexpect(defined(\"A_fit\") and rel(A_fit, _p[0], 1e-4), \"A_fit should be about \" + format(_p[0], \".3f\"))\nexpect(defined(\"k_fit\") and rel(k_fit, _p[1], 1e-4), \"k_fit should be about \" + format(_p[1], \".4f\") + \" per minute\")"}, {"id": "5b", "title": "Help it with a guess", "task": "<p>Enzyme speed follows v = Vmax × S ÷ (Km + S). Write <code class='i'>mm(S, Vmax, Km)<\/code> and fit it, giving starting guesses Vmax = 200 and Km = 50. Store the results in <code class='i'>vmax<\/code> and <code class='i'>km<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy.optimize import curve_fit\n\nS = np.array([5, 10, 20, 40, 80, 160, 320])\nv = np.array([18, 32, 55, 83, 112, 135, 148])\n", "hint": "def mm(S, Vmax, Km): return Vmax * S / (Km + S). Then curve_fit(mm, S, v, p0=[200, 50])", "solution": "import numpy as np\nfrom scipy.optimize import curve_fit\n\nS = np.array([5, 10, 20, 40, 80, 160, 320])\nv = np.array([18, 32, 55, 83, 112, 135, 148])\n\ndef mm(S, Vmax, Km):\n    return Vmax * S / (Km + S)\n\npopt, pcov = curve_fit(mm, S, v, p0=[200, 50])\nvmax, km = popt\nprint(vmax, km)", "check": "from scipy.optimize import curve_fit as _cf\n_p, _ = _cf(lambda s, a, b: a * s / (b + s), S, v, p0=[200, 50])\nexpect(\"p0\" in __code__, \"Give starting guesses with p0=[200, 50]\")\nexpect(defined(\"vmax\") and rel(vmax, _p[0], 1e-3), \"vmax should be about \" + format(_p[0], \".1f\"))\nexpect(defined(\"km\") and rel(km, _p[1], 1e-3), \"km should be about \" + format(_p[1], \".1f\"))"}, {"id": "5c", "title": "Report the uncertainty", "task": "<p>Fit the decay again, then store the uncertainty (standard error) of k in <code class='i'>k_err<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy.optimize import curve_fit\n\nt = np.array([0, 2, 4, 6, 8, 10, 12])\nc = np.array([1.00, 0.67, 0.45, 0.31, 0.20, 0.14, 0.09])\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n", "hint": "popt, pcov = curve_fit(decay, t, c), errors = np.sqrt(np.diag(pcov)), and k is the second parameter: errors[1]", "solution": "import numpy as np\nfrom scipy.optimize import curve_fit\n\nt = np.array([0, 2, 4, 6, 8, 10, 12])\nc = np.array([1.00, 0.67, 0.45, 0.31, 0.20, 0.14, 0.09])\n\ndef decay(t, A, k):\n    return A * np.exp(-k * t)\n\npopt, pcov = curve_fit(decay, t, c)\nerrors = np.sqrt(np.diag(pcov))\nk_err = errors[1]\nprint(f\"k = {popt[1]:.4f} ± {k_err:.4f}\")", "check": "from scipy.optimize import curve_fit as _cf\n_p, _c = _cf(lambda tt, A, k: A * np.exp(-k * tt), t, c)\n_e = np.sqrt(np.diag(_c))\nexpect(defined(\"k_err\"), \"Store the uncertainty of k in k_err\")\nexpect(not rel(k_err, _e[0], 1e-3), \"That’s the uncertainty of A. k is the second parameter: errors[1]\")\nexpect(rel(k_err, _e[1], 1e-3), \"k_err should be about \" + format(_e[1], \".5f\") + \". Use np.sqrt(np.diag(pcov))[1]\")"}]}, {"id": "s6", "title": "Smoothing & peaks", "blurb": "Clean up noisy signals and find their peaks.", "learn": [{"t": "<p>Real measurements are noisy. The <b>Savitzky–Golay filter<\/b> smooths data while keeping the shape of peaks better than a simple average. Give it the data, a <b>window length<\/b> (how many points to look at each time, an odd number), and a <b>polynomial order<\/b> (usually 2 or 3).<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.signal import savgol_filter\n\nrng = np.random.default_rng(2)\nx = np.linspace(0, 10, 300)\nclean = np.exp(-(x - 5) ** 2)\nnoisy = clean + rng.normal(0, 0.08, x.size)\nsmooth = savgol_filter(noisy, 31, 3)\n\nplt.plot(x, noisy, color=\"lightgray\", label=\"Noisy\")\nplt.plot(x, smooth, color=\"red\", label=\"Smoothed\")\nplt.legend()\nplt.show()", "out": "", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXkAAAD0CAYAAAB+WlaPAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAVVNJREFUeJztnXl8FPX9/58zu9kr90USwik3CBQMiICAoKIUFLwQz7ZWPPh5fC2WVqpVq/br1eLx9aDVtl54cBVE0aoFRBCMyCkgV4BAIDdJdjd7zfz+SGaY3WxC7mP5PB8PH5jd2Zn37M685vV5f96fz0dSVVVFIBAIBBGJ3NYBCAQCgaDlECIvEAgEEYwQeYFAIIhghMgLBAJBBCNEXiAQCCIYIfICgUAQwZjbOoBQUlJS6NGjR1uHIRAIBB2KnJwcCgsLa7ze7kS+R48eZGdnt3UYAoFA0KHIysoK+7pI1wgEAkEEI0ReIBAIIhgh8gKBQBDBtLucvEAgiCx8Ph+5ublUVla2dSgRgc1mo0uXLkRFRdVreyHyAoGgRcnNzSU2NpYePXogSVJbh9OhUVWVoqIicnNz6dmzZ70+I9I1AoGgRamsrCQ5OVkIfDMgSRLJyckNahUJkRcI6kBRFMRs3E1HCHzz0dDvUoi8QFALiqKwd+9eTp061dahCASNRoi8QFALiqIQCATwer1tHYpA0GiEyAsEtaAoStC/go7LX/7yF7744oug1/7whz/U+Zl///vfvPjiiy0ZVqsgRF4gqAUtFy9EvuOzaNEi7rrrLkpKSvTXXn/99To/M3LkSCZPntzSobU4QuQFgloQTj6yuOGGG3jwwQfDvrdo0SIuueQSrr76arZv3w7Ajh072LhxIwD//e9/ueGGG5g5cyabN2/G5XIxa9Ys/fOHDx/m3nvvbfmTaASiTl4gqAXh5JufvLw83G53s+7TbreTkZFxxu1uuukmbr75ZtasWcOECRP019etW8cLL7zAypUrOXr0KFdffTU//PADeXl5HDhwAIAbb7yRzZs3oygKb731FiNHjqS8vJyNGzdywQUX8O6779a7br21EU5eIKgFo5M/cOAAZWVlbRyRoCnIsszrr7/OnDlzgurMV6xYwS9/+UtSU1MZPnw4gwYNYvPmzUGfHTlyJI8++ijbt2/noYceAuCXv/wlb7/9NgAffPABN910U+udTAMQTl4gqAXNyft8PjweD263m7i4uDaOqmNTH8fdkgwdOpRp06bxv//7v8hylcdVVVX/fwCTyVSj9bZ8+XL++9//smzZMv7617/y5ZdfMm3aNB566CE2b95M7969SU1NbdVzqS/CyQsEtWAUeePfgo7NH//4R5YtW6b/rlOnTuVf//oXZWVl7N69m23btnH++efr21dWVnLrrbcyfPhwfvOb37Bz504CgQAWi4XLLruMuXPnctttt7XV6ZwR4eQFgloI7XgVufmOywUXXIDD4QCqcvgLFizgueeeA+Ciiy7itttuY+rUqcTGxvLBBx8QGxtLZmYmkiRhs9mYMmUK1113HQkJCbz33nuYTCagKle/ePHidl2FI6ntzJ5kZWWJlaEE7YKSkhKOHTum/52QkECXLl3aMKKOye7duxkwYEBbh9HseDwenn/+efx+P4888kirHjvcd1qbdgonLxDUQqhzb2d+SNDGPP300xw7dqzdD5gSIi8Q1EKoqIt0jcBIa7v3xiI6XgWCWhBOXhAJCJEXCEJQFIWcnBxcLleN1/ft2xc0NF4gaO8IkRcIQvD7/VRUVFBRURH0eiAQ0OvlBYKOQrOIfFlZGZ np.linspace(0, 10, 101)\ny = np.exp(-(x - 2) ** 2) + 0.6 * np.exp(-(x - 7) ** 2)\npeaks, info = find_peaks(y)\nprint(peaks)\nprint(x[peaks])", "out": "[20 70]\n[2. 7.]", "img": ""}, {"t": "<p>Noisy data has lots of tiny bumps that also count as peaks. Filter them out with settings:<\/p><p><code class='i'>height=<\/code> keeps peaks above a minimum value. <code class='i'>prominence=<\/code> keeps peaks that <b>stand out<\/b> from their surroundings by at least that much, which is usually the most useful setting.<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.signal import find_peaks\n\nrng = np.random.default_rng(5)\nx = np.linspace(0, 10, 400)\ny = np.exp(-(x - 3) ** 2 / 0.3) + 0.5 * np.exp(-(x - 7) ** 2 / 0.3) + rng.normal(0, 0.03, x.size)\n\nall_peaks, _ = find_peaks(y)\nreal_peaks, _ = find_peaks(y, prominence=0.2)\nprint(len(all_peaks), \"bumps, but only\", len(real_peaks), \"real peaks\")\nplt.plot(x, y)\nplt.plot(x[real_peaks], y[real_peaks], \"o\", color=\"red\")\nplt.show()", "out": "118 bumps, but only 2 real peaks", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXMAAAD0CAYAAABpeMZGAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAP8xJREFUeJztnXdgFGX6x7/bd7MlvYcQSqgBBAIiXcU7FLE3QCznGT05BT3vPA9Bf1jwlPMOGxr0TkVUFMvZqEcRpAYM1dACKaSXzfa+vz9mZ7Kb3TSyPc/nH5jZyeyTzMx3nvd5n/d5eE6n0wmCIAgiouGH2gCCIAii55CYEwRBRAEk5gRBEFEAiTlBEEQUQGJOEAQRBZCYEwRBRAHCUH1xUlIScnJyQvX1BEEQEceFCxfQ0NDg87OQiXlOTg6KiopC9fUEQRARR35+frufUZiFIAgiCiAxJwiCiAJIzAmCIKIAEnOCIIgogMScIAgiCiAxJ3yzdi2QkwPw+cy/a9eG2iKCIDogZKmJRBizdi1QUAAYDMx2WRmzDQDz5oXOLoIg2oU8c8KbxYtbhZzFYGD2EwQRlpCYE96Ul3dvP0EQIYfEnPAmO7t7+wmCCDkk5oQ3L74IxMR47ouJYfYTBBGWkJgT3sybBxQWolKVDAd4MGVkAYWFNPlJEGEMZbMQvpk3D5OPxQEA3p43BteNSA+tPQRBdAiJOeFFcYUaaoOF29abbSG0hiCIrtAtMf/pp5+gVqtxww03eH22d+9eHDp0CNOmTcOIESP8ZiARfG5662ePbYPFHiJLCILoKl2OmT/99NN46qmnsHz5cq/PPvroIzz99NMQi8W47777sH37dr8aSYQWvYU8c4IId7os5n379sUnn3zi87Ply5dj/fr ignal import savgol_filter\n\nrng = np.random.default_rng(7)\nx = np.linspace(0, 6, 200)\nnoisy = np.sin(x) + rng.normal(0, 0.1, x.size)\nsmooth = savgol_filter(noisy, 21, 3)\nplt.plot(x, noisy, color=\"lightgray\")\nplt.plot(x, smooth, color=\"red\")\nplt.show()", "check": "from scipy.signal import savgol_filter as _sg\nexpect(defined(\"smooth\") and same(smooth, _sg(noisy, 21, 3), 1e-9), \"smooth should be savgol_filter(noisy, 21, 3)\")"}, {"id": "6b", "title": "Find the big peaks", "task": "<p>This spectrum has three peaks, but only two are taller than 0.5. Find those two, and store their <b>x positions<\/b> in <code class='i'>peak_x<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy.signal import find_peaks\n\nx = np.linspace(0, 10, 201)\ny = 1.0 * np.exp(-(x - 2) ** 2 / 0.2) + 0.3 * np.exp(-(x - 5) ** 2 / 0.2) + 0.8 * np.exp(-(x - 8) ** 2 / 0.2)\n", "hint": "peaks, _ = find_peaks(y, height=0.5), then peak_x = x[peaks]", "solution": "import numpy as np\nfrom scipy.signal import find_peaks\n\nx = np.linspace(0, 10, 201)\ny = 1.0 * np.exp(-(x - 2) ** 2 / 0.2) + 0.3 * np.exp(-(x - 5) ** 2 / 0.2) + 0.8 * np.exp(-(x - 8) ** 2 / 0.2)\npeaks, _ = find_peaks(y, height=0.5)\npeak_x = x[peaks]\nprint(peak_x)", "check": "expect(defined(\"peak_x\"), \"Store the x positions in peak_x\")\nexpect(len(peak_x) == 2, \"There should be 2 peaks above 0.5. Use height=0.5\")\nexpect(same(peak_x, [2.0, 8.0], 1e-6), \"peak_x should be [2, 8]. Use x[peaks], not the index numbers\")"}, {"id": "6c", "title": "Ignore the noise", "task": "<p>Count the real peaks in this noisy signal. Use <code class='i'>prominence=0.2<\/code> so tiny bumps are ignored. Store the number in <code class='i'>n_peaks<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy.signal import find_peaks\n\nrng = np.random.default_rng(11)\nx = np.linspace(0, 12, 600)\ny = (np.exp(-(x - 2) ** 2 / 0.2) + 0.6 * np.exp(-(x - 6) ** 2 / 0.2)\n     + 0.8 * np.exp(-(x - 10) ** 2 / 0.2) + rng.normal(0, 0.04, x.size))\n", "hint": "peaks, _ = find_peaks(y, prominence=0.2), then n_peaks = len(peaks)", "solution": "import numpy as np\nfrom scipy.signal import find_peaks\n\nrng = np.random.default_rng(11)\nx = np.linspace(0, 12, 600)\ny = (np.exp(-(x - 2) ** 2 / 0.2) + 0.6 * np.exp(-(x - 6) ** 2 / 0.2)\n     + 0.8 * np.exp(-(x - 10) ** 2 / 0.2) + rng.normal(0, 0.04, x.size))\npeaks, _ = find_peaks(y, prominence=0.2)\nn_peaks = len(peaks)\nprint(n_peaks)", "check": "expect(\"prominence\" in __code__, \"Use prominence=0.2\")\nexpect(defined(\"n_peaks\") and n_peaks == 3, \"There are 3 real peaks\")"}]}, {"id": "s7", "title": "Areas & in-between values", "blurb": "Integrate data and functions, and estimate between points.", "learn": [{"t": "<p><b>Integration<\/b> means finding the <b>area under a curve<\/b>. It turns rates into totals: the area under speed vs time is distance, and the area under current vs time is electric charge.<\/p><p>For measured data points, use <code class='i'>integrate.trapezoid(y, x)<\/code>. It splits the area into thin slices and adds them up. Note the order: <b>y first<\/b>, then x.<\/p>", "code": "import numpy as np\nfrom scipy import integrate\n\ntime_s = np.array([0, 10, 20, 30, 40])\nspeed_ms = np.array([0, 5, 9, 12, 14])\ndistance = integrate.trapezoid(speed_ms, time_s)\nprint(f\"Distance: {distance} m\")", "out": "Distance: 330.0 m", "img": ""}, {"t": "<p>When you have a <b>formula<\/b> instead of data points, <code class='i'>integrate.quad(f, a, b)<\/code> integrates it from a to b very precisely. It gives back two numbers: the answer, and an estimate of its error.<\/p><p>It even handles infinity: use <code class='i'>np.inf<\/code>. Answers like 9.000000000000002 are the same tiny computer rounding, and mean 9.<\/p>", "code": "import numpy as np\nfrom scipy import integrate\n\ndef f(x):\n    return x ** 2\n\narea, error = integrate.quad(f, 0, 3)\nprint(area)\n\narea, error = integrate.quad(lambda x: np.exp(-x), 0, np.inf)\nprint(area)", "out": "9.000000000000002\n1.0000000000000002", "img": ""}, {"t": "<p>The <code class='i'>lambda x: ...<\/code> above is a short way to write a one-line function without <code class='i'>def<\/code>. Both styles work the same.<\/p>"}, {"t": "<p><b>Interpolation<\/b> estimates values <b>between<\/b> your measured points. <code class='i'>np.interp<\/code> joins points with straight lines. <code class='i'>CubicSpline<\/code> draws a <b>smooth curve<\/b> through them, which often fits real behaviour better. Once made, you use a spline like a function.<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.interpolate import CubicSpline\n\nx = np.array([0, 1, 2, 3, 4])\ny = np.array([0, 0.8, 0.9, 0.1, -0.8])\nspline = CubicSpline(x, y)\nprint(f\"At x = 2.5: {spline(2.5):.3f}\")\n\nx_fine = np.linspace(0, 4, 100)\nplt.plot(x, y, \"o\", label=\"Measured\")\nplt.plot(x_fine, np.interp(x_fine, x, y), \"--\", label=\"Straight lines\")\nplt.plot(x_fine, spline(x_fine), label=\"Cubic spline\")\nplt.legend()\nplt.show()", "out": "At x = 2.5: 0.578", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAX8AAAD0CAYAAABzRCbIAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAUaBJREFUeJzt3XdUFFcfxvHv0rsIIiioYAHsqCj2gho1ilGjYolGzRvsEbsGe++xRRMSo8YWJQL2rmCPomIHGzYQaYJIZ5n3j4mbEDRRKQtyP+dwdOfO7D6z6G9nZ+7cq5AkSUIQBEEoVjTUHUAQBEEoeKL4C4IgFEOi+AuCIBRDovgLgiAUQ6L4C4IgFEOi+AuCIBRDWuoO8K5KlSqFra2tumMIgiAUKQ8fPiQmJibH8iJT/G1tbQkKClJ3DEEQhCLF2dn5jcvFaR9BEIRiSBR/QRCEYijXxT8tLY1x48bRu3fvHG2ZmZlMmjSJRo0aMXr0aNLS0lRtO3bsoGXLlnTt2pW7d+/mNoYgCILwHnJ9zr9Hjx40b96cnTt35mibM2cOmZmZHD16lCVLljB58mSWLVvGlStXWLRoEQcOHCA0NJSuXbty7do1NDTEFxFBKIoyMjJ4+vQpqamp6o5SbOnp6WFjY4O2tvY7ra/I7cBujx8/xtLSEkdHR8LCwrK1OTo6cuHCBUxMTEhNTcXBwYFHjx4xduxY6tWrR58+fQDo1q0bY8eOpUmTJm99HWdnZ3HBVxAKqbCwMIyNjTE3N0ehUKg7TrEjSRKxsbEkJiZiZ2eXre1ttTPXh9rly5d/a5jU1FRMTEwA+VNJT0+PV69e8fDhQ6pUqaJat0qVKjk+OAC8vb1xdnbG2dmZ6Ojo3EYVBCGfpKamisKvRgqFAnNz8/f65pVvXT3f  18, 20, 20, 19])\ndistance = integrate.trapezoid(speed, t)\nprint(distance)", "check": "expect(defined(\"distance\") and near(distance, 447.5), \"distance should be 447.5 m. Check the order: trapezoid(speed, t)\")"}, {"id": "7b", "title": "Charge from current", "task": "<p>A battery’s discharge current was measured in <b>milliamps<\/b> over time in <b>seconds<\/b>. Charge = area under current vs time.<\/p><p>Calculate the charge in <b>coulombs<\/b> (convert mA to A first by dividing by 1000). Store it in <code class='i'>charge_C<\/code>.<\/p>", "starter": "import numpy as np\nfrom scipy import integrate\n\nt_s = np.array([0, 60, 120, 180, 240, 300])\ncurrent_mA = np.array([500, 480, 470, 455, 430, 380])\n", "hint": "integrate.trapezoid(current_mA / 1000, t_s)", "solution": "import numpy as np\nfrom scipy import integrate\n\nt_s = np.array([0, 60, 120, 180, 240, 300])\ncurrent_mA = np.array([500, 480, 470, 455, 430, 380])\ncharge_C = integrate.trapezoid(current_mA / 1000, t_s)\nprint(f\"{charge_C:.1f} C\")", "check": "expect(defined(\"charge_C\"), \"Store the answer in charge_C\")\nexpect(not near(charge_C, 136500, 1), \"Convert mA to A first: divide current_mA by 1000\")\nexpect(near(charge_C, 136.5, 1e-6), \"charge_C should be 136.5 C\")"}, {"id": "7c", "title": "Integrate a formula", "task": "<p>Use <code class='i'>integrate.quad<\/code> to find the area under y = e<sup>−x²<\/sup> from minus infinity to infinity. Store it in <code class='i'>area<\/code>.<\/p><p>(Fun fact: the answer is exactly √π.)<\/p>", "starter": "import numpy as np\nfrom scipy import integrate\n", "hint": "area, error = integrate.quad(lambda x: np.exp(-x ** 2), -np.inf, np.inf)", "solution": "import numpy as np\nfrom scipy import integrate\n\narea, error = integrate.quad(lambda x: np.exp(-x ** 2), -np.inf, np.inf)\nprint(area, np.sqrt(np.pi))", "check": "expect(\"quad\" in __code__, \"Use integrate.quad\")\nexpect(defined(\"area\") and near(area, np.sqrt(np.pi), 1e-8), \"area should be about 1.7725. quad gives two numbers: use area, error = ...\")"}]}, {"id": "s8", "title": "Solving & a real analysis", "blurb": "Solve equations, find the best values, and run a Tafel analysis.", "learn": [{"t": "<p><b>Root finding<\/b> means finding where a function equals zero. <code class='i'>optimize.brentq(f, a, b)<\/code> searches between a and b. It needs f(a) and f(b) to have <b>opposite signs<\/b>, so that the zero is definitely somewhere in between.<\/p><p>Checking the answer gives a tiny number like 3.5e-15 (that’s 0.0000000000000035) instead of exactly 0. That’s normal: computers round decimals very slightly.<\/p>", "code": "from scipy import optimize\n\ndef f(x):\n    return x ** 3 - 2 * x - 5\n\nroot = optimize.brentq(f, 2, 3)\nprint(root)\nprint(f(root))", "out": "2.094551481542327\n3.552713678800501e-15", "img": ""}, {"t": "<p>Root finding also answers “<b>when does it reach<\/b> a value?”. Move the target to the other side so the question becomes “when is this zero?”. Example: when does a 100 g sample decay to 30 g?<\/p>", "code": "import numpy as np\nfrom scipy import optimize\n\ndef remaining(t):\n    return 100 * np.exp(-0.2 * t)\n\nt30 = optimize.brentq(lambda t: remaining(t) - 30, 0, 50)\nprint(f\"Reaches 30 g after {t30:.2f} hours\")", "out": "Reaches 30 g after 6.02 hours", "img": ""}, {"t": "<p><b>Optimisation<\/b> finds the <b>lowest<\/b> point of a function, like the cheapest or most efficient design. <code class='i'>optimize.minimize_scalar(f)<\/code> gives back a result: <code class='i'>.x<\/code> is where the minimum is, and <code class='i'>.fun<\/code> is the value there. Add <code class='i'>bounds=(a, b)<\/code> and <code class='i'>method=\"bounded\"<\/code> to search only a sensible range.<\/p>", "code": "from scipy import optimize\n\ndef cost(speed):\n    return 0.02 * speed ** 2 + 400 / speed\n\nresult = optimize.minimize_scalar(cost, bounds=(10, 150), method=\"bounded\")\nprint(f\"Cheapest at {result.x:.1f} km/h, cost {result.fun:.2f}\")", "out": "Cheapest at 21.5 km/h, cost 27.85", "img": ""}, {"t": "<p><b>A real analysis: Tafel slope.<\/b> In electrochemistry, the overpotential η needed to drive a reaction grows with the <b>logarithm<\/b> of current density j. Plot η against log<sub>10<\/sub>(j), and part of the curve becomes a straight line. Its slope, the <b>Tafel slope<\/b> in mV per decade, says how efficient a catalyst is: smaller is better.<\/p><p>The method combines everything you know: NumPy for logs, a mask to pick the straight region, and a linear fit.<\/p>", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nj = np.array([0.5, 1, 2, 3, 5, 7, 10, 20, 40])                     # mA/cm²\neta = np.array([0.231, 0.252, 0.270, 0.281, 0.294, 0.303, 0.312, 0.341, 0.390])  # V\n\nlog_j = np.log10(j)\nregion = (j >= 1) & (j <= 10)\nfit = stats.linregress(log_j[region], eta[region])\nprint(f\"Tafel slope: {fit.slope * 1000:.0f} mV/dec\")\n\nplt.plot(log_j, eta, \"o\", label=\"Data\")\nplt.plot(log_j[region], fit.slope * log_j[region] + fit.intercept, color=\"red\", label=\"Tafel fit\")\nplt.xlabel(\"log10 j (mA/cm²)\")\nplt.ylabel(\"Overpotential (V)\")\nplt.legend()\nplt.show()", "out": "Tafel slope: 60 mV/dec", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYkAAAEECAYAAADd88i7AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAALEwAACxMBAJqcGAAAPrBJREFUeJzt3Xlcjfn///HHKVGIhAmRXVIiQkRki7GFGbthFo0ZY2cmzPgwwzDWj0EIH7uxJowla2GskW3sBk1lSalIKfX+/XF+zldaFB1Fr/vt5nbrXNf7Oud1Hafz7Lre1/V+a5RSCiGEECINBjldgBBCiNxLQkIIIUS6JCSEEEKkS0JCCCFEuiQkhBBCpEtCQgghRLry5XQB2a1EiRJUqFAhp8sQQoj3xu3bt3n48GGa6z64kKhQoQKBgYE5XYYQQrw3HB0d010np5uEEEKkS0JCCCFEuiQkhBBCpOuD65NIS2JiIiEhIcTHx+d0KbmKsbExZcuWxcjIKKdLEULkUnkiJEJCQjA1NaVChQpoNJqcLidXUEoRERFBSEgIFStWzOlyhBC5VJ4Iifj4eAmIV2g0GooXL054eHhOlyKEeAu+QaFM97tKWFQcZcxMGO1mjbuDZbY9f54ICUACIg3yngjxfvMNCmWMzwXiEpMACI2KY4zPBYBsCwrpuBZCiPfUdL+ruoB4IS4xiel+V7PtNSQkhBDiPRUWFZel5W8iz5xuyk
